# Builds and tests wtbuild (tools/wtbuild, the Rust build): its regression tests compare against committed goldens
# (tools/wtbuild/testdata/golden) made from stand-in programs in tools/wtbuild/testdata (no game code), and the lifted
# code must compile to the same objects without system headers. Nothing of a dump is needed. The link step is checked by
# release.yml (wtbuild smoke).
name: wtbuild

on:
  pull_request:
    paths: ['tools/wtbuild/**', 'lifter/**', 'runtime/gen_static/**', 'runtime/freestanding/**',
            'tests/language_test.c', 'tests/mx_prev_test.c', 'tests/mv_match_test.c',
            'tests/gpu_component_report_test.py', 'tests/temporal_diag_wiring_test.py',
            'android/app/src/main/cpp/save_export*', 'android/app/src/main/java/org/witchtime/android/*Activity.java', 'android/app/src/main/AndroidManifest.xml', 'android/app/src/main/cpp/CMakeLists.txt', 'tests/save_export*',
            'runtime/nvn_vk.c', 'runtime/nvn_vk_fsr.c', 'runtime/nvn_vk_sgsr.c', 'runtime/nvn_vk_sgsr_cs.c', 'runtime/nvn_vk_upscale.c', 'runtime/gfx_options.c', 'runtime/pcmenu.c', 'runtime/third_party/fsr3/**', 'runtime/third_party/sgsr2/**', 'tests/fsr_*', 'tests/sgsr_*', 'tests/upscale_*', 'tests/upscaler_config_test.py', 'tests/pcmenu_selftest.c', 'tests/rs_store_*', 'tests/pass_timestamp*.py', 'tests/android_surface_test.py', 'tests/vulkan_only_test.py', 'tests/vulkan_requirements_test.c',
            'runtime/*.h', 'runtime/plat_posix.c', 'runtime/nvn_gl.c', 'runtime/mx_translate.c', 'runtime/tex_decode.c', 'runtime/tex_pack.c', 'runtime/nvn_vk_draw.c', 'runtime/nvn_vk_flash.c', 'runtime/diag.c', 'runtime/diag_writer.c', 'runtime/diag_replay.c', 'runtime/game_shim.c', 'android/app/src/main/cpp/main.c', 'android/app/src/main/cpp/diag_bootstrap.c', 'android/app/src/main/cpp/diag_bootstrap.h', 'scripts/android-package.sh', 'tests/bc7_encode_test.c', 'tests/rebind_test.c', 'tests/presence_test.c', 'runtime/presence.c', 'tests/rs_pyramid_test.c', 'tests/tex_pack_test.c', 'tests/plat_hash_test.c', 'tests/mx_loop_guard_test.c', 'tests/mx_quad_test.c', 'tests/scene_step_test.c', 'tests/quad_walk_test.c', 'tests/ordered_helpers_test.c', 'tests/compute_buffer_coherency_test.py', 'tests/android_bootstrap_test.py', 'tests/flash_detector_policy_test.py', 'tests/treatment_controls_test.py', 'tests/soft_ww_metadata_test.py', 'tests/soft_ww_query_reset_test.py', 'tests/soft_ww_transaction_test.py', 'tests/soft_ww_fault_handler_test.py', 'tests/soft_ww_chaining_test.py', 'tests/soft_ww_lease_test.py', 'tests/soft_ww_consumer_test.py', 'tests/producer_wait_test.py', 'tests/loadclear_command_test.py', 'tests/diag_*', 'tests/gfx_diag_hook_test.c', 'tools/lifter-check/**', '.gitattributes', '.github/workflows/wtbuild.yml']
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          echo 'nameserver 1.1.1.1' | sudo tee /etc/resolv.conf      # 2026-11-11: the runners' own resolver timed out on the Ubuntu mirrors' names (20 s a try); take this line out when it answers again
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld libssl-dev

      - name: Build and unit tests
        run: |
          cargo build --release --locked --manifest-path tools/wtbuild/Cargo.toml
          cargo test --release --locked --manifest-path tools/wtbuild/Cargo.toml

      - name: Freestanding compile (runtime/freestanding against the system's headers)
        run: tools/wtbuild/target/release/wtbuild check-freestanding --words 200000 --seed 1 --jobs 4

      - name: The runtime's own SHA-1 and MD5 (runtime/plat_hash.h) against OpenSSL
        run: |
          clang -O2 -Wall -I runtime tests/plat_hash_test.c -lcrypto -o "$RUNNER_TEMP/plat_hash_test"
          "$RUNNER_TEMP/plat_hash_test"

      - name: The fmaf of a CPU without FMA3 (runtime/soft_fmaf.h) against the instruction
        run: |
          clang -O1 -DSOFT_FMAF_TEST -x c runtime/soft_fmaf.h -o "$RUNNER_TEMP/soft_fmaf_test"
          "$RUNNER_TEMP/soft_fmaf_test"

      - name: The start language against the game's tables (runtime/language_pick.h, issue 160)
        run: |
          clang -O1 -w -I runtime -I runtime/posix tests/language_test.c -o "$RUNNER_TEMP/language_test"
          "$RUNNER_TEMP/language_test"

      - name: The BC7 pack's reader and the fallback encoder (runtime/tex_pack.c, tex_decode.c, issue 54)
        run: |
          clang -O2 -Wall -I runtime tests/tex_pack_test.c runtime/tex_pack.c -o "$RUNNER_TEMP/tex_pack_test"
          (cd "$RUNNER_TEMP" && ./tex_pack_test)
          clang -O2 -I runtime tests/bc7_encode_test.c runtime/tex_decode.c -lm -o "$RUNNER_TEMP/bc7_encode_test"
          "$RUNNER_TEMP/bc7_encode_test"

      - name: The shader translator's loop guard (runtime/mx_translate.c, issue 26)
        run: |
          clang -O2 -Wall -I runtime tests/mx_loop_guard_test.c runtime/mx_translate.c -o "$RUNNER_TEMP/mx_loop_guard_test"
          "$RUNNER_TEMP/mx_loop_guard_test"

      - name: A vertex stage's previous position (runtime/mx_translate.c, motion vectors)
        run: |
          clang -O2 -Wall -I runtime tests/mx_prev_test.c runtime/mx_translate.c -o "$RUNNER_TEMP/mx_prev_test"
          "$RUNNER_TEMP/mx_prev_test"

      - name: Last frame's object constants are paired by nearness (runtime/mv_match.h, motion vectors)
        run: |
          clang -O2 -Wall -I runtime tests/mv_match_test.c -o "$RUNNER_TEMP/mv_match_test"
          "$RUNNER_TEMP/mv_match_test"

      - name: Fragment stages work on quads, not lane numbers (runtime/mx_translate.c, issue 66)
        run: |
          clang -O2 -Wall -I runtime tests/mx_quad_test.c runtime/mx_translate.c -o "$RUNNER_TEMP/mx_quad_test"
          "$RUNNER_TEMP/mx_quad_test"

      - name: The step of cutscenes and menus (runtime/scene_step.h, issue 47)
        run: |
          clang -O2 -Wall -I runtime tests/scene_step_test.c -o "$RUNNER_TEMP/scene_step_test"
          "$RUNNER_TEMP/scene_step_test"
          clang -O2 -Wall -I runtime tests/rebind_test.c -o "$RUNNER_TEMP/rebind_test"
          "$RUNNER_TEMP/rebind_test"
          clang -O2 -Wall -I runtime tests/quad_walk_test.c -o "$RUNNER_TEMP/quad_walk_test"
          "$RUNNER_TEMP/quad_walk_test"
          clang -O2 -Wall -I runtime tests/rs_pyramid_test.c -o "$RUNNER_TEMP/rs_pyramid_test"
          "$RUNNER_TEMP/rs_pyramid_test"
          clang -O2 -Wall -I runtime tests/fsr_dither_test.c -o "$RUNNER_TEMP/fsr_dither_test"
          "$RUNNER_TEMP/fsr_dither_test"
          clang -O2 -Wall -I runtime tests/fsr_limits_test.c -o "$RUNNER_TEMP/fsr_limits_test"
          "$RUNNER_TEMP/fsr_limits_test"
          clang -O2 -Wall -I runtime tests/fsr_evidence_test.c -o "$RUNNER_TEMP/fsr_evidence_test"
          "$RUNNER_TEMP/fsr_evidence_test"
          clang -O2 -Wall -I runtime tests/upscale_scene_test.c -o "$RUNNER_TEMP/upscale_scene_test"
          "$RUNNER_TEMP/upscale_scene_test"
          clang -O2 -Wall -I runtime tests/upscale_route_test.c -o "$RUNNER_TEMP/upscale_route_test"
          "$RUNNER_TEMP/upscale_route_test"
          clang -O2 -Wall -I runtime tests/sgsr_params_test.c -o "$RUNNER_TEMP/sgsr_params_test"
          "$RUNNER_TEMP/sgsr_params_test"
          python3 tests/fsr_evidence_wiring_test.py
          python3 tests/fsr_cleanup_test.py
          python3 tests/sgsr_cleanup_test.py
          python3 tests/sgsr_resources_test.py
          python3 tests/sgsr_cs_gpu_env_test.py
          python3 tests/upscale_retirement_test.py
          python3 tests/pass_timestamp_test.py
          python3 tests/gpu_component_report_test.py
          python3 tests/temporal_diag_wiring_test.py
          if printf '#include <vulkan/vulkan.h>\n' | clang -E -I deps/android-arm64/include -x c - >/dev/null 2>&1; then
            python3 tests/sgsr_cs_resources_test.py
            python3 tests/sgsr_cs_compile_test.py
            python3 tests/pass_timestamp_lifecycle_test.py
            python3 tests/upscale_reset_lifecycle_test.py
          else
            echo "Vulkan-header compile/lifecycle checks not run: existing headers unavailable"
          fi
          python3 tests/fsr_image_usage_test.py
          python3 tests/upscaler_config_test.py
          python3 tests/upscale_lifecycle_wiring_test.py
          python3 tests/upscale_scale_test.py
          python3 tests/rs_store_test.py
          python3 tests/rs_store_production_test.py
          clang -O2 -Wall tests/rs_store_coverage_test.c -o "$RUNNER_TEMP/rs_store_coverage_test"
          "$RUNNER_TEMP/rs_store_coverage_test"
          if command -v glslc >/dev/null && command -v spirv-dis >/dev/null; then
            python3 tests/fsr_shader_test.py "$(command -v glslc)" "$(command -v spirv-dis)"
            python3 tests/sgsr_shader_test.py "$(command -v glslc)" "$(command -v spirv-dis)"
            python3 tests/sgsr_source_test.py "$(command -v glslc)" "$(command -v spirv-dis)"
            python3 tests/sgsr_cs_source_test.py "$(command -v glslc)" "$(command -v spirv-dis)"
            python3 tests/upscale_motion_test.py "$(command -v glslc)" "$(command -v spirv-dis)" --compile-only
            python3 tests/upscale_reactive_test.py "$(command -v glslc)" "$(command -v spirv-dis)" --compile-only
            if printf '#include <vulkan/vulkan.h>\n' | clang -E -I deps/android-arm64/include -x c - >/dev/null 2>&1; then
              python3 tests/rs_store_gpu_test.py "$(command -v glslc)" --compile-only
              python3 tests/sgsr_cs_focused_gpu_test.py "$(command -v glslc)" "$(command -v spirv-dis)" --compile-only
            else
              echo "Full-grid Vulkan harness compile not run: existing headers unavailable"
            fi
          else
            echo 'FSR shader reflection skipped: glslc or spirv-dis is unavailable'
          fi

      - name: Discord Rich Presence (runtime/presence.c)
        run: |
          clang -O2 -Wall -I runtime -I runtime/posix '-D__declspec(x)=' tests/presence_test.c -lpthread -o "$RUNNER_TEMP/presence_test"
          "$RUNNER_TEMP/presence_test"

      - name: Ordered memory helpers and publication channel (runtime/runtime.h, tests/ordered_helpers_test.c)
        run: |
          clang -O2 -Wall -I runtime tests/ordered_helpers_test.c -lpthread -o "$RUNNER_TEMP/ordered_helpers_test"
          "$RUNNER_TEMP/ordered_helpers_test"

      - name: Compute buffer coherency and write-check harness (runtime/nvn_vk_draw.c, tests/compute_buffer_coherency_test.py)
        run: python3 tests/compute_buffer_coherency_test.py

      - name: Android bootstrap hint order and failure test (android/app/src/main/cpp/main.c, tests/android_bootstrap_test.py)
        run: python3 tests/android_bootstrap_test.py

      - name: Committed save export trust boundaries (synthetic POSIX fixtures only)
        run: python3 tests/save_export_test.py

      - name: Flash detector policy and capture guard test (runtime/nvn_vk_flash.c, tests/flash_detector_policy_test.py)
        run: python3 tests/flash_detector_policy_test.py

      - name: Treatment controls and diagnostics typed request validation (tests/treatment_controls_test.py)
        run: python3 tests/treatment_controls_test.py

      - name: Soft write-watch metadata and eligibility (runtime/plat_posix.c, tests/soft_ww_metadata_test.py)
        run: python3 tests/soft_ww_metadata_test.py

      - name: Soft write-watch queries, reset and rearming (runtime/plat_posix.c, tests/soft_ww_query_reset_test.py)
        run: python3 tests/soft_ww_query_reset_test.py

      - name: Soft write-watch transactions and logical protection (runtime/plat_posix.c, tests/soft_ww_transaction_test.py)
        run: python3 tests/soft_ww_transaction_test.py

      - name: Soft write-watch fault handler and positive recovery (runtime/plat_posix.c, tests/soft_ww_fault_handler_test.py)
        run: python3 tests/soft_ww_fault_handler_test.py

      - name: Soft write-watch alternate stack and signal chaining (runtime/plat_posix.c, tests/soft_ww_chaining_test.py)
        run: python3 tests/soft_ww_chaining_test.py

      - name: Soft write-watch write leases around blocking I/O (runtime/plat_posix.c, tests/soft_ww_lease_test.py)
        run: python3 tests/soft_ww_lease_test.py

      - name: Soft write-watch consumer integration and teardown (runtime/nvn_gl.c, runtime/nvn_vk_draw.c, tests/soft_ww_consumer_test.py)
        run: python3 tests/soft_ww_consumer_test.py

      - name: Producer-scoped GPU waiting and indirect stabilization (runtime/nvn_vk_draw.c, tests/producer_wait_test.py)
        run: python3 tests/producer_wait_test.py

      - name: Leading colour clear pass folding (runtime/nvn_vk_draw.c, tests/loadclear_command_test.py)
        run: python3 tests/loadclear_command_test.py

      - name: Lightweight Android diagnostics, streaming, replay, crash, and input policy suites
        run: |
          clang -O2 -Wall -I runtime tests/diag_unit_test.c runtime/diag.c -lpthread -o "$RUNNER_TEMP/diag_unit_test"
          "$RUNNER_TEMP/diag_unit_test"
          clang -O2 -Wall -I runtime -I android/app/src/main/cpp tests/diag_bootstrap_test.c -o "$RUNNER_TEMP/diag_bootstrap_test"
          "$RUNNER_TEMP/diag_bootstrap_test"
          clang -O2 -Wall -I runtime tests/diag_writer_test.c runtime/diag_writer.c runtime/diag.c -lpthread -o "$RUNNER_TEMP/diag_writer_test"
          "$RUNNER_TEMP/diag_writer_test"
          python3 tests/diag_boot_config_test.py
          python3 tests/temporal_source_capture_test.py
          python3 tests/temporal_source_lifecycle_test.py
          clang -O2 -Wall -I runtime tests/diag_seal_test.c runtime/diag_writer.c -lpthread -o "$RUNNER_TEMP/diag_seal_test"
          "$RUNNER_TEMP/diag_seal_test"
          clang -O2 -Wall -I runtime tests/diag_hook_ownership_test.c -lpthread -o "$RUNNER_TEMP/diag_hook_ownership_test"
          "$RUNNER_TEMP/diag_hook_ownership_test"
          clang -O2 -Wall -I runtime tests/diag_streaming_test.c runtime/diag_writer.c runtime/diag.c -lpthread -o "$RUNNER_TEMP/diag_streaming_test"
          "$RUNNER_TEMP/diag_streaming_test"
          clang -O2 -Wall -I runtime tests/diag_timestamp_test.c -o "$RUNNER_TEMP/diag_timestamp_test"
          "$RUNNER_TEMP/diag_timestamp_test"
          clang -O2 -Wall -I runtime tests/diag_incident_test.c runtime/diag_writer.c runtime/diag.c -lpthread -o "$RUNNER_TEMP/diag_incident_test"
          "$RUNNER_TEMP/diag_incident_test"
          clang -O2 -Wall -I runtime tests/diag_crash_test.c runtime/diag.c -lpthread -o "$RUNNER_TEMP/diag_crash_test"
          "$RUNNER_TEMP/diag_crash_test"
          clang -O2 -Wall -I runtime tests/diag_continuous_test.c runtime/diag.c -lpthread -o "$RUNNER_TEMP/diag_continuous_test"
          "$RUNNER_TEMP/diag_continuous_test"
          clang -O2 -Wall -I runtime tests/diag_live_status_test.c runtime/diag_writer.c runtime/diag.c -lpthread -o "$RUNNER_TEMP/diag_live_status_test"
          "$RUNNER_TEMP/diag_live_status_test"
          clang -O2 -Wall -I runtime tests/diag_semantic_shim_test.c runtime/game_shim.c runtime/diag.c -lpthread -o "$RUNNER_TEMP/diag_semantic_shim_test"
          "$RUNNER_TEMP/diag_semantic_shim_test"
          clang -O2 -Wall -I runtime tests/diag_input_policy_test.c runtime/diag_replay.c runtime/diag.c -lpthread -o "$RUNNER_TEMP/diag_input_policy_test"
          "$RUNNER_TEMP/diag_input_policy_test"
          clang -O2 -Wall -I runtime tests/diag_replay_test.c runtime/diag_replay.c runtime/diag.c -lpthread -o "$RUNNER_TEMP/diag_replay_test"
          "$RUNNER_TEMP/diag_replay_test"
          python3 tests/diag_replay_hid_test.py
          clang -O2 -Wall -I runtime tests/gfx_diag_hook_test.c runtime/diag.c -lpthread -o "$RUNNER_TEMP/gfx_diag_hook_test"
          "$RUNNER_TEMP/gfx_diag_hook_test" 

  lifter-check:
    # the shipped lifter against Unicorn: random words of the forms added to the lifter, run in Unicorn and as their lifted C
    # (no dump needed)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          echo 'nameserver 1.1.1.1' | sudo tee /etc/resolv.conf      # 2026-11-11: the runners' own resolver timed out on the Ubuntu mirrors' names (20 s a try); take this line out when it answers again
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev cmake ninja-build

      - name: Lifter against Unicorn (tools/lifter-check)
        run: |
          cargo build --release --locked --manifest-path tools/wtbuild/Cargo.toml
          cargo test --release --locked --manifest-path tools/lifter-check/Cargo.toml
          cargo run --release --locked --manifest-path tools/lifter-check/Cargo.toml -- --synthetic 2000 --seed 1
