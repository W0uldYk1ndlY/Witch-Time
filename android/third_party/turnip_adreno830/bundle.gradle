import groovy.json.JsonSlurper
import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.security.MessageDigest

def bundleSource = file(wtTurnipBundleSource)
def manifestFile = new File(bundleSource, 'assets/bundled_driver/adreno830/bundle-manifest.json')
def localInput = providers.gradleProperty('wtTurnipDriverFile').orElse(providers.environmentVariable('WT_TURNIP_DRIVER_FILE'))
def generatedAssets = layout.buildDirectory.dir('generated/turnipAssets')

tasks.register('generateTurnipBundleAssets') {
    inputs.dir new File(bundleSource, 'assets')
    inputs.property('localDriverPath', localInput.orElse(''))
    outputs.dir generatedAssets
    // Verify cached bytes on every invocation, including offline builds.
    outputs.upToDateWhen { false }
    doLast {
        def manifest = new JsonSlurper().parse(manifestFile)
        def destination = new File(generatedAssets.get().asFile, manifest.assetPath)
        destination.parentFile.mkdirs()
        def check = { File file ->
            if (file.length() != manifest.sizeBytes) throw new GradleException('Turnip driver size mismatch')
            def digest = MessageDigest.getInstance('SHA-256')
            long total = 0
            file.withInputStream { stream ->
                byte[] buffer = new byte[65536]
                int count
                while ((count = stream.read(buffer)) != -1) {
                    total += count
                    if (total > manifest.sizeBytes) throw new GradleException('Turnip cached driver exceeds pinned byte limit')
                    digest.update(buffer, 0, count)
                }
            }
            if (total != manifest.sizeBytes || digest.digest().encodeHex().toString() != manifest.sha256)
                throw new GradleException('Turnip driver SHA-256 mismatch')
        }
        if (localInput.isPresent() || !destination.exists()) {
            def temporary = Files.createTempFile(destination.parentFile.toPath(), '.turnip-', '.tmp')
            try {
                InputStream input
                if (localInput.isPresent()) {
                    input = new File(localInput.get()).newInputStream()
                } else {
                    if (gradle.startParameter.offline) throw new GradleException('Turnip asset is not cached; supply -PwtTurnipDriverFile for offline builds')
                    def connection = new URL(manifest.sourceUrl).openConnection()
                    connection.connectTimeout = 15000
                    connection.readTimeout = 30000
                    input = connection.inputStream
                }
                def digest = MessageDigest.getInstance('SHA-256')
                long total = 0
                input.withCloseable { stream ->
                    Files.newOutputStream(temporary).withCloseable { output ->
                        byte[] buffer = new byte[65536]
                        int count
                        while ((count = stream.read(buffer)) != -1) {
                            total += count
                            if (total > manifest.sizeBytes) throw new GradleException('Turnip driver exceeds pinned byte limit')
                            digest.update(buffer, 0, count)
                            output.write(buffer, 0, count)
                        }
                    }
                }
                if (total != manifest.sizeBytes || digest.digest().encodeHex().toString() != manifest.sha256)
                    throw new GradleException('Turnip driver size or SHA-256 mismatch')
                Files.move(temporary, destination.toPath(), StandardCopyOption.ATOMIC_MOVE, StandardCopyOption.REPLACE_EXISTING)
            } finally {
                Files.deleteIfExists(temporary)
            }
        }
        check(destination)
        copy { from new File(bundleSource, 'assets'); into generatedAssets }
    }
}
